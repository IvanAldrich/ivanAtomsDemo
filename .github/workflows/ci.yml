name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:/tmp/atoms-ci.db
      SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: E2E smoke (web + worker + SSE)
        run: |
          mkdir -p storage
          npx prisma db push --skip-generate
          LLM_API_KEY= LLM_BASE_URL= LLM_MODEL= npm start > /tmp/atoms-web.log 2>&1 &
          WEB_PID=$!
          LLM_API_KEY= LLM_BASE_URL= LLM_MODEL= npm run worker > /tmp/atoms-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WEB_PID $WORKER_PID 2>/dev/null || true' EXIT
          npm run test:e2e
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/atoms-web.log
            /tmp/atoms-worker.log

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare isolated networks and firewall
        run: sudo env SANDBOX_IMAGE=node:22-bookworm SANDBOX_RUNTIME_NETWORK=atoms-runtime SANDBOX_BUILD_NETWORK=atoms-build bash scripts/docker-setup.sh
      - run: npm run test:sandbox
        env:
          RUN_SANDBOX_TESTS: "1"
          SANDBOX_IMAGE: node:22-bookworm
          SANDBOX_RUNTIME_NETWORK: atoms-runtime
          SANDBOX_BUILD_NETWORK: atoms-build