<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>浏览器游戏</title>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:monospace;display:flex;flex-direction:column;align-items:center;padding:24px}
canvas{border:2px solid #334155;border-radius:8px;background:#1e293b}
p{color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<h3 style="margin:0 0 8px">🚀 星际躲避</h3>
<canvas id="c" width="360" height="240"></canvas>
<p>← → 或 A/D 移动 · 躲开陨石</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let px=170,rocks=[],score=0,over=false;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')px-=18;if(e.key==='ArrowRight'||e.key==='d')px+=18});
setInterval(()=>{if(over)return;rocks.push({x:Math.random()*330,y:-10});},600);
function loop(){
 if(over){x.fillStyle='#ef4444';x.font='20px monospace';x.fillText('Game Over '+score,90,120);return}
 x.fillStyle='#1e293b';x.fillRect(0,0,360,240);
 x.fillStyle='#60a5fa';x.beginPath();x.arc(px,210,10,0,7);x.fill();
 rocks=rocks.filter(r=>r.y<250);
 rocks.forEach(r=>{r.y+=4;x.fillStyle='#f59e0b';x.fillRect(r.x,r.y,14,14);
   if(Math.abs(r.x+7-px)<16&&Math.abs(r.y+7-210)<16)over=true;});
 score++;x.fillStyle='#94a3b8';x.font='12px monospace';x.fillText('score '+score,10,20);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
