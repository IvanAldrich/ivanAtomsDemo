<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>作品集</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;color:#111}
header{padding:64px 48px;background:#111;color:#fff}
header h1{margin:0 0 8px;font-size:30px;font-weight:600}
header p{color:#a1a1aa;margin:0}
.grid{columns:3;column-gap:16px;padding:32px 48px;max-width:1000px;margin:0 auto}
.item{break-inside:avoid;margin-bottom:16px;background:#f4f4f5;border-radius:10px;overflow:hidden}
.item div{height:120px;display:flex;align-items:center;justify-content:center;color:#71717a;font-size:13px}
.item p{margin:0;padding:10px 12px;font-size:13px;font-weight:600}
footer{padding:32px;text-align:center;color:#a1a1aa;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>林一舟 · 产品设计师</h1>
  <p>交互设计 / 设计系统 / 数据可视化</p>
</header>
<div class="grid">
  <div class="item"><div style="background:#dbeafe">截图 A</div><p>金融 App 改版</p></div>
  <div class="item"><div style="background:#dcfce7">截图 B</div><p>设计系统 Nimbus</p></div>
  <div class="item"><div style="background:#fae8ff">截图 C</div><p>BI 可视化平台</p></div>
  <div class="item"><div style="background:#fef3c7">截图 D</div><p>旅行规划工具</p></div>
  <div class="item"><div style="background:#e0f2fe">截图 E</div><p>社区小程序</p></div>
  <div class="item"><div style="background:#f1f5f9">截图 F</div><p>品牌官网</p></div>
</div>
<footer>hello@yizhou.design</footer>
</body>
</html>
