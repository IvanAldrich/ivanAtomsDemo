<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>数据仪表板</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;padding:24px}
h2{margin:0 0 16px;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:14px;border:1px solid #e2e8f0}
.card b{font-size:20px;display:block}
.card small{color:#64748b}
.up{color:#16a34a}.down{color:#dc2626}
.chart{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;margin-top:20px}
th{background:#f1f5f9;text-align:left;padding:8px}
td{padding:8px;border-top:1px solid #f1f5f9}
</style>
</head>
<body>
<h2>运营概览</h2>
<div class="cards">
<div class="card"><small>访问量</small><b class="up">12,480</b><small>↑ 8.2%</small></div>
<div class="card"><small>注册</small><b class="up">326</b><small>↑ 12%</small></div>
<div class="card"><small>付费</small><b>48</b><small>↑ 3.1%</small></div>
<div class="card"><small>流失</small><b class="down">7</b><small>↓ 2.0%</small></div>
</div>
<div class="chart">
<svg viewBox="0 0 600 160" width="100%">
<polyline fill="none" stroke="#4f46e5" stroke-width="2" points="0,120 60,100 120,110 180,70 240,85 300,50 360,60 420,30 480,45 540,20 600,25"/>
<polyline fill="none" stroke="#22c55e" stroke-width="2" points="0,140 60,135 120,125 180,130 240,110 300,115 360,95 420,100 480,85 540,80 600,70"/>
</svg>
</div>
<table>
<tr><th>渠道</th><th>访问</th><th>转化率</th></tr>
<tr><td>自然搜索</td><td>6,200</td><td>3.4%</td></tr>
<tr><td>社交</td><td>3,900</td><td>2.1%</td></tr>
<tr><td>直接</td><td>2,380</td><td>4.8%</td></tr>
</table>
</body>
</html>
